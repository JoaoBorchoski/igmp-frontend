<style>
	.modal-overlay {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background-color: rgba(0, 0, 0, 0.7);
		display: flex;
		justify-content: center;
		align-items: center;
		z-index: 1000;
	}

	.modal-content {
		background-color: white;
		padding: 24px;
		border-radius: 8px;
		width: 80%;
		box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	}

	.modal-header {
		display: flex;
		justify-content: space-between;
		align-items: center;
		border-bottom: 1px solid #eee;
		padding-bottom: 16px;
		margin-bottom: 16px;
	}

	.modal-header h2 {
		margin: 0;
	}

	.close-btn {
		background: none;
		border: none;
		font-size: 24px;
		cursor: pointer;
		color: #888;
	}

	.close-btn:hover {
		color: #333;
	}

	.modal-footer {
		display: flex;
		justify-content: flex-end;
		padding-top: 16px;
	}

	.card {
		background-color: #fff;
		transition: background-color 0.2s ease-in-out !important;
	}

	.card:hover {
		background-color: rgba(12, 154, 190, 0.5);
	}
</style>

<po-page-list [p-actions]="pageActions" [p-filter]="filterSettings" [p-literals]="listLiterals" [p-title]="this.literals.title">
	<div style="padding: 20px; overflow-x: auto">
		<table style="width: 100%; border-collapse: collapse">
			<thead>
				<tr>
					<th
						style="
							background-color: #ebecf0;
							font-weight: bold;
							color: #44546a;
							padding: 15px 10px;
							border: 1px solid #ccc;
							vertical-align: top;
							text-align: center;
							min-width: 250px;
						"
					>
						Novo
					</th>
					<th
						style="
							background-color: #ebecf0;
							font-weight: bold;
							color: #44546a;
							padding: 15px 10px;
							border: 1px solid #ccc;
							vertical-align: top;
							text-align: center;
							min-width: 250px;
						"
					>
						Em andamento
					</th>
					<th
						style="
							background-color: #ebecf0;
							font-weight: bold;
							color: #44546a;
							padding: 15px 10px;
							border: 1px solid #ccc;
							vertical-align: top;
							text-align: center;
							min-width: 250px;
						"
					>
						Aguardando
					</th>
					<th
						style="
							background-color: #ebecf0;
							font-weight: bold;
							color: #44546a;
							padding: 15px 10px;
							border: 1px solid #ccc;
							vertical-align: top;
							text-align: center;
							min-width: 250px;
						"
					>
						Concluído
					</th>
				</tr>
			</thead>
			<tbody *ngIf="negociacoes.length > 0">
				<tr>
					<td
						*ngFor="let col of columns; let i = index"
						style="
							border: 1px solid #ccc;
							padding: 10px;
							vertical-align: top;
							text-align: center;
							min-width: 250px;
							background-color: #f4f5f7;
						"
					>
						<div
							*ngFor="let negociacao of filterByStatus(i)"
							(click)="onCardClick(negociacao)"
							style="
								border-radius: 3px;
								box-shadow: 0 1px 0 rgba(9, 30, 66, 0.25);
								margin-bottom: 8px;
								padding: 10px;
								cursor: pointer;
								text-align: left;
								transition: transform 0.2s ease-in-out;
							"
							class="card"
						>
							<p style="margin: 0 0 5px; font-size: 16px; font-weight: bold; color: #172b4d">
								{{ negociacao.clienteNome }}
							</p>
							<p style="margin: 0 0 5px; font-size: 14px; color: #6b778c">{{ negociacao.descricao }}</p>
							<p style="margin: 0 0 5px; font-size: 14px; color: #6b778c">Valor Estimado: R$ {{ negociacao.valorEstimado }}</p>
							<p style="margin: 0; font-size: 12px; color: #a5adba">Criação: {{ negociacao.dataCriacaoFormatted }}</p>
						</div>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<app-no-data *ngIf="negociacoes.length == 0"> </app-no-data>
</po-page-list>

<po-modal
	#poModal
	p-size="xl"
	p-hide-close="true"
	[p-primary-action]="primaryAction"
	[p-secondary-action]="secondaryAction"
	p-title="Negociação"
	class="po-sm-12 po-md-12 po-lg-12 po-xl-12 no-padding"
>
	<form [formGroup]="negociacaoForm" class="po-sm-12 po-md-12 po-lg-12 po-xl-12 no-padding">
		<div class="po-sm-12 po-md-12 po-lg-12 po-xl-12 no-padding">
			<po-input
				class="po-sm-12 po-md-12 po-lg-12 po-xl-12 po-required"
				formControlName="descricao"
				name="descricao"
				[p-label]="this.literals.fields.form['descricao']"
				p-readonly
				p-required
			></po-input>
		</div>

		<div class="po-sm-12 po-md-6 po-lg-6 po-xl-6 no-padding">
			<po-select
				class="po-sm-12 po-md-12 po-lg-12 po-xl-12 po-required"
				formControlName="status"
				name="status"
				[p-label]="this.literals.fields.form['status']"
				[p-options]="statusOptions"
				p-required
			></po-select>
		</div>

		<div class="po-sm-12 po-md-6 po-lg-6 po-xl-6 no-padding">
			<po-datepicker
				class="po-sm-12 po-md-12 po-lg-12 po-xl-12 po-required"
				formControlName="dataCriacao"
				name="dataCriacao"
				[p-label]="this.literals.fields.form['dataCriacao']"
				p-readonly
				p-required
			></po-datepicker>
		</div>

		<div class="po-sm-12 po-md-12 po-lg-12 po-xl-12 no-padding">
			<po-decimal
				class="po-sm-12 po-md-12 po-lg-12 po-xl-12 po-required"
				formControlName="valorEstimado"
				name="valorEstimado"
				[p-label]="this.literals.fields.form['valorEstimado']"
				p-icon="fa-solid fa-dollar-sign"
				p-required
			></po-decimal>
		</div>
	</form>
</po-modal>
